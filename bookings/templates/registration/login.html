{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WorkNest — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="text-center mb-3">
            <img src="{% static 'img/logo-full.jpg' %}" alt="Edgar E-File Solutions" style="height:60px;">
        </div>
        <h1 class="brand">WorkNest</h1>
        <p class="tagline">Workplace Meeting &amp; Room Management</p>

        {% if form.errors %}
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-circle me-1"></i> Invalid username or password.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-person me-1"></i> Username</label>
                <input type="text" name="username" class="form-control" required autofocus autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-lock me-1"></i> Password</label>
                <input type="password" name="password" class="form-control" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i> Log In
            </button>
        </form>
    </div>
</body>
</html>
